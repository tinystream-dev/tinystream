#
# `mkdir -p config data && sudo chown 1000:1000 config data && docker compose up -d`
# pulls the latest release and starts it on port 3000. Use the UID/GID from `user` below if changed.
# Point each library in Settings (or config.toml's `[[library]] path`) at where it's mounted under /media.
# For VA-API transcoding on hosts with /dev/dri, see docker-compose.vaapi.yaml.

services:
  tinystream:
    image: ghcr.io/tinystream-dev/tinystream:latest
    # Build and run from source: `docker compose up -d --build --pull never`.
    build: .
    restart: unless-stopped
    # Whoever owns your media; config/ and data/ need to be writable by them too.
    user: "1000:1000"
    ports:
      - "3000:3000"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - ./config:/config
      - ./data:/data
      - /path/to/media:/media
      # Tailscale: see network_mode below.
      # - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    # Tailscale: tinystream finds tailscaled through its socket (above) and the tailnet through the
    # host's network, so remove `ports` with this. For `[tailscale] expose`, the host user with the
    # UID above has to be tailscaled's operator (`sudo tailscale set --operator=<user>`).
    # network_mode: host
