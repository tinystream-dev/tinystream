# Fragments for what shows up in several places, shared by web/ and mobile/.

fragment Person on User {
  id
  username
  avatar
}

fragment PermissionsFields on Permissions {
  allLibraries
  libraries
  request
  autoApprove
  requestLimit
  manageRequests
  manageShows
  downloads
  editMetadata
  watchTogether
  shareLinks
  clip
  clipMaxLength
  clipLimit
  clipStorage
  clipLinks
}

fragment Viewer on User {
  ...Person
  isAdmin
  permissions {
    ...PermissionsFields
  }
}

fragment Card on Title {
  id
  kind
  library
  name
  year
  poster
  backdrop
  watchedCount
  videoCount
  progress
  freshCount
}

fragment VideoRow on Video {
  id
  season
  episode
  episodeEnd
  label
  name
  overview
  still
  customStill
  airDate
  duration
  position
  finished
}

fragment TitleDetail on Title {
  ...Card
  posterTint
  backdropTint
  customPoster
  customBackdrop
  overview
  genres
  rating
  path
  matchState
  provider
  providerId
  libraryProvider
  seasons {
    number
    name
    title
    overview
    poster
    episodes {
      ...VideoRow
    }
  }
  movie {
    ...VideoRow
  }
  nextUp {
    resuming
    video {
      ...VideoRow
    }
  }
}

fragment Playback on Video {
  id
  still
  label
  name
  position
  finished
  title {
    id
    kind
    name
    backdrop
  }
