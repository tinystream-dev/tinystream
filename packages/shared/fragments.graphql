    id
    label
    name
  }
  next {
    id
    still
    label
    name
  }
  media {
    duration
    video {
      index
      codec
      codecString
      width
      height
      fps
      bitDepth
      hdr
    }
    audio {
      index
      codec
      codecString
      channels
      language
      title
      default
    }
    subtitles {
      id
      codec
      language
      title
      default
      forced
      supported
    }
    fonts {
      index
      filename
    }
    chapters {
      start
      end
      title
    }
