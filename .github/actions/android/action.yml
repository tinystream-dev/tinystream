name: Android build dependencies
description: Sets up what the app's native build needs (JDK 17, the Android SDK, the NDK pinned in mobile/app.config.ts, Rust for Android, cargo-ndk) and installs the workspace.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
    - uses: android-actions/setup-android@v3
      with:
        packages: ""
    - name: Install the NDK
      shell: bash
      run: |
        ndk="$(sed -n "s/^export const NDK = '\(.*\)'/\1/p" mobile/app.config.ts)"
        sdkmanager --install "ndk;$ndk" "build-tools;36.0.0" "platforms;android-36" "cmake;3.31.6" > /dev/null
        echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,x86_64-linux-android
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk,cargo-about
    - uses: Swatinem/rust-cache@v2
      with:
        key: android
        workspaces: "mobile -> target"
    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'mobile/app.config.ts') }}
        restore-keys: gradle-${{ runner.os }}-
    - shell: bash
      run: bun install --frozen-lockfile
