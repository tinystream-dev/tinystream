name: Rust toolchain
description: Installs the nightly pinned in rust-toolchain.toml, so every job (and rust-cache's keys) builds on the same one.

inputs:
  targets:
    description: Targets to install besides the host's.
    default: ""
  components:
    description: Components to install besides the minimal profile's.
    default: ""

runs:
  using: composite
  steps:
    - name: Read rust-toolchain.toml
      id: toolchain
      shell: bash
      run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
