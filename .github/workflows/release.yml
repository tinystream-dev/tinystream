name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Docker images are only made from the glibc builds.
          - { target: x86_64-unknown-linux-gnu, runner: blacksmith-4vcpu-ubuntu-2404, libc: gnu, docker: linux/amd64 }
          - { target: aarch64-unknown-linux-gnu, runner: blacksmith-4vcpu-ubuntu-2404-arm, libc: gnu, docker: linux/arm64 }
          - { target: x86_64-unknown-linux-musl, runner: blacksmith-4vcpu-ubuntu-2404, libc: musl }
          - { target: aarch64-unknown-linux-musl, runner: blacksmith-4vcpu-ubuntu-2404-arm, libc: musl }
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/native-deps
        if: matrix.libc == 'gnu'
      # rustyass, in burn-in and the web player's subtitles, is on nightly.
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126,cargo-about
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Cache musl native libraries
        if: matrix.libc == 'musl'
        uses: actions/cache@v4
        with:
          path: .native-musl
          key: native-musl-${{ matrix.target }}-${{ hashFiles('native/**/Cargo.toml', 'native/**/build.rs', 'native/support/src/**') }}
          restore-keys: native-musl-${{ matrix.target }}-

      - name: Build web UI
        if: matrix.libc == 'musl'
        run: |
          bun install --frozen-lockfile --filter tinystream-web --filter @tinystream/shared
          cd web
          bun run build

      - name: Build
        if: matrix.libc == 'gnu'
        run: cargo build --release --locked

      - name: Build musl
        if: matrix.libc == 'musl'
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e CARGO_TERM_COLOR \
            -e TS_BUILD_OWNER="$(id -u):$(id -g)" \
            -e TINYSTREAM_SKIP_WEB_BUILD=1 \
            -e TINYSTREAM_NATIVE_DIR=/workspace/.native-musl \
            -e RUSTC_WRAPPER=/workspace/.github/scripts/rustc-host \
            rust:alpine sh -ec '
              apk add --no-cache \
                build-base pkgconf curl git tar bash \
                meson ninja autoconf automake libtool \
                clang-dev openssl-dev openssl-libs-static libdrm-dev linux-headers \
                zlib-dev zlib-static bzip2-dev bzip2-static xz-dev xz-static
              git config --global --add safe.directory /workspace
              cargo build --release --locked --target "${{ matrix.target }}"
              chown -R "$TS_BUILD_OWNER" target .native-musl
            '

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="tinystream-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          binary="target/release/tinystream"
          native=.native
          if [ "${{ matrix.libc }}" = musl ]; then
            binary="target/${{ matrix.target }}/release/tinystream"
            native=.native-musl
          fi
          licenses/collect.sh "$native" "${{ matrix.target }}" > "dist/$name/THIRD_PARTY_LICENSES"
          cp "$binary" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "dir=dist/$name" >> "$GITHUB_OUTPUT"
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: tinystream-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

      # Each architecture's image is pushed by digest; the docker job below puts them under one tag.
      - uses: docker/setup-buildx-action@v3
        if: matrix.docker && startsWith(github.ref, 'refs/tags/v')
      - uses: docker/login-action@v3
        if: matrix.docker && startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker image
        id: docker
        if: matrix.docker && startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.package.outputs.dir }}
          file: Dockerfile
          target: prebuilt
          platforms: ${{ matrix.docker }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
        env:
          # The record's artifact name starts with the owner, `tinystream-dev`, so Publish's `tinystream-*` would pick it up.
          DOCKER_BUILD_RECORD_UPLOAD: false
      - name: Save the image's digest
        if: matrix.docker && startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.docker.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: matrix.docker && startsWith(github.ref, 'refs/tags/v')
        with:
          name: docker-digest-${{ matrix.target }}
          path: digests/*
          retention-days: 1

  android:
    name: Build Android app
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: ./.github/actions/android
      - name: Build
        working-directory: mobile
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          bun run release
          rm "$ANDROID_KEYSTORE_FILE"
      - name: Package
        id: package
        run: |
          version="$(sed -n 's/^  "version": "\(.*\)",/\1/p' mobile/package.json)"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "mobile/package.json is $version, but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
          apk="mobile/android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk" > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          name="tinystream-${version}-android-arm64.apk"
          mkdir -p dist
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "apk=dist/$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tinystream-android
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.apk }}.sha256

  # Publishes whatever got built after all targets finish or reach their timeout.
  release:
    name: Publish
    needs: [build, android]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tinystream-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Unlike the release, the image needs both architectures: `latest` without one would stop working there.
  docker:
    name: Publish Docker image
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Tag the image
        working-directory: digests
        run: |
          if [ "$(ls | wc -l)" != 2 ]; then
            echo "the image needs both amd64 and arm64, but only these were built: $(ls)" >&2
            exit 1
          fi
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.description=A small self-hosted media server" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            $(printf "$IMAGE@sha256:%s " *)
