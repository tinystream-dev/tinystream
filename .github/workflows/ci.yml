name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
    branches: [main]
  pull_request:
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing debugs CI's builds; without debug info they link faster and cache smaller.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # The server (Rust), web UI and apps build independently: each only when its own files change. The
  # server embeds the web UI, so its jobs take the UI from the web job, but a UI change alone doesn't
  # rebuild the server.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            server:
              - '**'
              - '!mobile/**'
              - '!desktop/**'
              - '!web/**'
              - '!packages/**/!(schema.graphql)'
              - '!package.json'
              - '!bun.lock'
              - '!bunfig.toml'
              - '!.github/actions/android/**'
            web:
              - '{web,packages}/**'
              - '{package.json,bun.lock,bunfig.toml}'
              - '.github/workflows/ci.yml'
            mobile:
              - '{mobile,packages}/**'
              - '{package.json,bun.lock,bunfig.toml}'
              - '.github/actions/android/**'
              - '.github/workflows/ci.yml'
            desktop:
              - 'desktop/**'
              - 'native/**'
              - '.github/actions/native-deps/**'
              - '{theme,squircle}/**'
              - 'packages/shared/{schema.graphql,fragments.graphql,src/logo.ts}'
              - '{rust-toolchain.toml,rustfmt.toml}'
              - '.github/actions/rust/**'
              - '.github/workflows/ci.yml'

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path mobile/Cargo.toml

  web:
    name: Web UI
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The music player's decoder and the video player's subtitles (rustyass, on nightly) are Rust, built for the browser.
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126,cargo-about
      # The workspace is installed from the root; web only needs its own packages.
      - run: bun install --frozen-lockfile --filter tinystream-web --filter @tinystream/shared
        working-directory: .
      - run: cargo test -p tinystream-subtitles --locked
        working-directory: .
      - run: bun run typecheck
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  mobile:
    name: Mobile app
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Shared code
        working-directory: packages/shared
        run: |
          bun run codegen
          bun run typecheck
          bun run test
      - name: App
        working-directory: mobile
        run: |
          bun run codegen
          bun run typecheck
          bun run test
      - name: Generated code is current
        run: git diff --exit-code -- packages/shared/src/schema.ts mobile/src/gql

  android:
    name: Android build
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android
      - name: Build
        working-directory: mobile
        run: |
          bunx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a
      - name: Check 16 KB alignment
        run: "$ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 mobile/android/app/build/outputs/apk/debug/app-debug.apk > /dev/null"

  desktop:
    name: Desktop app
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-deps
        with:
          cache: native-desktop
      # winit and wgpu load Wayland, X11 and Vulkan at runtime; the headers are for x11-dl's build
      # script and the tests. libmpv links EGL, PipeWire and ALSA, libdisplay-info reads hwdata's
      # PNP IDs, and the mpv tests render on Mesa's software EGL.
      - name: System packages
        run: |
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libx11-dev libvulkan-dev \
            libegl-dev libpipewire-0.3-dev libasound2-dev hwdata libegl-mesa0 libgl1-mesa-dri
      - uses: ./.github/actions/rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo --locked fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      - run: cargo build --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Package desktop test build
        working-directory: .
        run: |
          name=tinystream-desktop-linux-x86_64-test
          mkdir -p "dist/$name"
          cp desktop/target/debug/tinystream-desktop LICENSE desktop/docs/player-validation.md "dist/$name/"
          licenses/collect.sh .native x86_64-unknown-linux-gnu desktop > "dist/$name/THIRD_PARTY_LICENSES"
          printf 'Commit: %s\nProfile: debug (unoptimized)\n' "$GITHUB_SHA" > "dist/$name/BUILD.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x86_64-test-${{ github.sha }}
          path: dist/tinystream-desktop-linux-x86_64-test.tar.gz
          retention-days: 14

  # One job for the server: the feature sets share the build's dependencies, native libraries and
  # cache, so checking each alone after it costs little more than the server itself.
  rust:
    name: Build and test
    needs: [changes, web]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    env:
      TINYSTREAM_SKIP_WEB_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-deps
      - uses: ./.github/actions/rust
      # Only main saves: pull requests restore its cache, and their own copies would push it out.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo check --locked --no-default-features
      - run: cargo check --locked --no-default-features --features web-ui
      - run: cargo check --locked --no-default-features --features metadata
      - run: cargo check --locked --no-default-features --features web-ui,metadata
