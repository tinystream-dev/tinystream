name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
    branches: [main]
  pull_request:
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  # The server (Rust), web UI and app build independently: each only when its own files change. The
  # server embeds the web UI, so its jobs take the UI from the web job, but a UI change alone doesn't
  # rebuild the server.
  changes:
    name: Changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            server:
              - '**'
              - '!mobile/**'
              - '!web/**'
              - '!packages/**/!(schema.graphql)'
              - '!package.json'
              - '!bun.lock'
              - '!bunfig.toml'
              - '!.github/actions/android/**'
            web:
              - '{web,packages,decoder}/**'
              - '{package.json,bun.lock,bunfig.toml}'
              - '.github/workflows/ci.yml'
            mobile:
              - '{mobile,packages,decoder}/**'
              - '{package.json,bun.lock,bunfig.toml}'
              - '.github/actions/android/**'
              - '.github/workflows/ci.yml'

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.mobile == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path mobile/Cargo.toml

  web:
    name: Web UI
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.web == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: web
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: oven-sh/setup-bun@v2
      # The music player's decoder is Rust, built for the browser.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      # The workspace is installed from the root; web only needs its own packages.
      - run: bun install --frozen-lockfile --filter tinystream-web --filter @tinystream/shared
        working-directory: .
      - run: cargo test -p tinystream-decoder-core --locked
        working-directory: .
      - run: bun run typecheck
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  mobile:
    name: Mobile app
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Shared code
        working-directory: packages/shared
        run: |
          bun run codegen
          bun run typecheck
          bun run test
      - name: App
        working-directory: mobile
        run: |
          bun run codegen
          bun run typecheck
          bun run test
      - name: Generated code is current
        run: git diff --exit-code -- packages/shared/src/schema.ts mobile/src/gql

  android:
    name: Android build
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: ./.github/actions/android
      - name: Build
        working-directory: mobile
        run: |
          bunx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a
      - name: Check 16 KB alignment
        run: "$ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 mobile/android/app/build/outputs/apk/debug/app-debug.apk > /dev/null"

  rust:
    name: Build and test
    needs: [changes, web]
    if: needs.changes.outputs.server == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      TINYSTREAM_SKIP_WEB_BUILD: "1"
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: ./.github/actions/native-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: cargo build --locked
      - run: cargo test --locked

  features:
    name: Features (${{ matrix.features.name }})
    needs: [changes, web]
    if: needs.changes.outputs.server == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        features:
          - { name: none, flags: --no-default-features }
          - { name: web-ui, flags: --no-default-features --features web-ui }
          - { name: metadata, flags: --no-default-features --features metadata }
          - { name: web-ui + metadata, flags: --no-default-features --features web-ui,metadata }
    env:
      TINYSTREAM_SKIP_WEB_BUILD: "1"
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: ./.github/actions/native-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features.name }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: cargo check --locked ${{ matrix.features.flags }}

  msrv:
    name: MSRV
    needs: [changes, web]
    if: needs.changes.outputs.server == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      TINYSTREAM_SKIP_WEB_BUILD: "1"
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: ./.github/actions/native-deps
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: cargo check --locked
