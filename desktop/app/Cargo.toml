[package]
name = "tinystream-desktop"
description = "The tinystream desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tinystream-desktop"
path = "src/main.rs"

[dependencies]
dirs = "6"
futures = "0.3"
iced_core = { git = "https://github.com/iced-rs/iced.git", rev = "cd04b74ca7073766f654535d6e72c452ef749d07", features = ["crisp"] }
iced_wgpu = { git = "https://github.com/iced-rs/iced.git", rev = "cd04b74ca7073766f654535d6e72c452ef749d07", default-features = false, features = ["web-colors"] }
iced_widget = { git = "https://github.com/iced-rs/iced.git", rev = "cd04b74ca7073766f654535d6e72c452ef749d07", features = ["wgpu", "canvas"] }
iced_winit = { git = "https://github.com/iced-rs/iced.git", rev = "cd04b74ca7073766f654535d6e72c452ef749d07", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
# Vulkan only: mpv's frames reach wgpu through Vulkan-allocated memory (#86).
wgpu = { version = "30", default-features = false, features = ["vulkan"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
