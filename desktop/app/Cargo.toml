[package]
name = "tinystream-desktop"
description = "The tinystream desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tinystream-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "6"
futures = "0.3"
getrandom = "=0.3.4"
graphql_client = { version = "=0.14.0", default-features = false }
iced_core = { git = "https://github.com/iced-rs/iced.git", rev = "cd04b74ca7073766f654535d6e72c452ef749d07", features = ["crisp"] }
iced_wgpu = { git = "https://github.com/iced-rs/iced.git", rev = "cd04b74ca7073766f654535d6e72c452ef749d07", default-features = false, features = ["web-colors", "image"] }
iced_widget = { git = "https://github.com/iced-rs/iced.git", rev = "cd04b74ca7073766f654535d6e72c452ef749d07", features = ["wgpu", "canvas", "image"] }
iced_winit = { git = "https://github.com/iced-rs/iced.git", rev = "cd04b74ca7073766f654535d6e72c452ef749d07", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "fs", "io-util"] }
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
# Vulkan only: mpv's frames reach wgpu through Vulkan-allocated memory (#86).
wgpu = { version = "30", default-features = false, features = ["vulkan"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[build-dependencies]
graphql_client_codegen = "=0.14.0"
graphql-parser = "=0.4.1"
syn = "=1.0.109"
