query Playback($id: Int!) {
  video(id: $id) { ...Playback }
  server { clips transcoding { ...TranscodingFields } }
  viewer { id permissions { clip watchTogether } }
}

mutation SaveProgress($videoId: Int!, $position: Float!, $duration: Float!) {
  saveProgress(videoId: $videoId, position: $position, duration: $duration) { id }
}

mutation TakeScreenshot($input: NewScreenshot!) {
  takeScreenshot(input: $input) { id poster }
}

query PlayerSchedule($id: Int!) {
  title(id: $id) { series { id monitor status next { ...SeriesEpisodeFields } } }
}

query PlayerOverview($id: Int!, $videoId: Int!) {
  title(id: $id) { overview }
  video(id: $videoId) { overview }
}

query PlayerClipAllowance {
  clipAllowance { canClip canLink maxLength customDefaultFont }
}

mutation PlayerCreateClip($input: NewClip!) {
  createClip(input: $input) { id }
}

query PlayerClipStatus($id: Int!) {
  clip(id: $id) { id state progress error }
}
