[package]
name = "tinystream-subtitles"
description = "The web player's subtitles: rustyass, in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustyass = { path = "../../rustyass" }
# Has to be the version of the wasm-bindgen CLI that builds it.
wasm-bindgen = "=0.2.126"
