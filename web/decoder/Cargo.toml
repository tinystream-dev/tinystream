[package]
name = "tinystream-decoder"
description = "The web player's decoder: files to PCM, in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tinystream-decoder-core = { path = "../../decoder/core" }
# Has to be the version of the wasm-bindgen CLI that builds it.
wasm-bindgen = "=0.2.126"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
