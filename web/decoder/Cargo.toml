[package]
name = "tinystream-decoder"
description = "The web player's decoder: files to PCM, in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rubato = "5"
symphonia = { version = "0.6", default-features = false, features = ["flac", "mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "wav", "aiff", "pcm"] }
# Has to be the version of the wasm-bindgen CLI that builds it.
wasm-bindgen = "=0.2.126"

