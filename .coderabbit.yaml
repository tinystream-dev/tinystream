# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: false
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
  finishing_touches:
    autofix:
      enabled: true
    unit_tests:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
  path_filters:
    - "!**/Cargo.lock"
    - "!**/bun.lock"
    - "!web/src/gql/**"
    - "!mobile/src/gql/**"
    - "!decoder/core/tests/fixtures/**"
    - "!licenses/**"
    - "!.agents/**"
    - "!.claude/**"
  path_instructions:
    - path: "src/**"
      instructions: >-
        The tinystream server. RSS and Torznab sources must never be hardcoded;
        they come from the user's configuration.
    - path: "migrations/**"
      instructions: >-
        SQLite migrations run by sqlx in numbered order. A released migration
        is never edited; changes go in a new numbered file.
    - path: "desktop/**"
      instructions: >-
        The desktop app (iced, libmpv, rustyass), a Cargo workspace of its own.
        Decisions are settled in epic #80. Every cargo command uses --locked,
        and new crates must go through the audit in #81. The app owns the winit
        event loop and wgpu device through iced's integration APIs, without
        forks. Platform-specific code belongs behind the Desktop trait in
        desktop/app/src/platform/.
    - path: "mobile/**"
      instructions: >-
        The Android app (Expo, React Native), sharing code with web/ through
        packages/shared. mobile/android/ and mobile/ios/ are generated by expo
        prebuild and must never be committed; native changes go through config
        plugins (mobile/plugins/) and local Expo modules (mobile/modules/).
        Rust crates go in mobile/crates/. Screens use the shared effects
        (mobile/src/effects/), haptics (mobile/modules/haptics) and theme
        tokens (mobile/src/theme/) instead of new ones.
    - path: "**/*.{ts,tsx}"
      instructions: >-
        TypeScript is formatted by hand and Prettier is not used; don't
        suggest formatting changes or Prettier.
    - path: "packages/shared/**"
      instructions: >-
        Shared by web/ and mobile/. After a schema change, codegen must be run
        in packages/shared/, web/ and mobile/.
  tools:
    clippy:
      enabled: true
    biome:
      enabled: true
    eslint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    osvScanner:
      enabled: true
    github-checks:
      enabled: true
    ast-grep:
      enabled: false
    actionlint:
      enabled: false
    zizmor:
      enabled: false
    hadolint:
      enabled: false
    shellcheck:
      enabled: false
    yamllint:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    checkov:
      enabled: false
    trivy:
      enabled: false
    semgrep:
      enabled: false
    opengrep:
      enabled: false
    clang:
      enabled: false
    cppcheck:
      enabled: false
    fbinfer:
      enabled: false
    detekt:
      enabled: false
    sqlfluff:
      enabled: false
    squawk:
      enabled: false
    oxc:
      enabled: false
    reactDoctor:
      enabled: false
    stylelint:
      enabled: false
    htmlhint:
      enabled: false
    dotenvLint:
      enabled: false
    presidio:
      enabled: false
    skillspector:
      enabled: false

chat:
  auto_reply: true
