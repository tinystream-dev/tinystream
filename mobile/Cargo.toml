[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.39.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Phrolova <me@phrolova.moe>"]
repository = "https://github.com/phrolova/tinystream"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
