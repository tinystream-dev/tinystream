accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
    "aarch64-linux-android",
    "x86_64-linux-android",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }


# rustyass, tinystream's subtitle renderer, is under the LGPL, which is the GPL plus permissions: its
# text has to go with the GPL's, so both are listed as if it were under both.
[rustyass]
accepted = ["LGPL-3.0-or-later", "GPL-3.0-or-later"]

[rustyass.clarify]
license = "LGPL-3.0-or-later AND GPL-3.0-or-later"

