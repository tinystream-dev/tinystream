[package]
name = "libtorrent-src"
# The version of libtorrent it builds.
version = "2.0.11"
edition.workspace = true
description = "A static libtorrent-rasterbar"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
links = "torrent-rasterbar"

[dependencies]
boost-src = { path = "../boost" }

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
pkg-config = "0.3"
native-support = { path = "../support" }
