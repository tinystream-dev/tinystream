[package]
name = "ffmpeg-src"
# The version of FFmpeg it builds (8.0 upstream).
version = "8.0.0"
edition.workspace = true
description = "A static FFmpeg's libraries, built with everything else in native/"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
links = "ffmpeg"

[dependencies]
nasm-src = { path = "../nasm" }
dav1d-src = { path = "../dav1d" }
x264-src = { path = "../x264" }
zimg-src = { path = "../zimg" }
opus-src = { path = "../opus" }
lame-src = { path = "../lame" }

# libva (and with it libdrm) is Linux's; macOS gets VideoToolbox from the system instead.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
libva-src = { path = "../libva" }

# NVDEC and CUVID decoding, for the desktop app. ffnvcodec loads libcuda at runtime, so the binary
# still runs on machines without NVIDIA.
ffnvcodec-src = { path = "../ffnvcodec", optional = true }

[features]
nvdec = ["dep:ffnvcodec-src"]

[build-dependencies]
native-support = { path = "../support" }
